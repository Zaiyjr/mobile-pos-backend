openapi: 3.1.0
info:
  title: Mobile Shop Management API
  version: 1.0.0
  description: >-
    Express API for the mobile shop management system. Successful responses use
    {success: true, message?: string, data: any}; errors use the documented
    error envelope. Existing paths remain available under /api/v1, /api, and
    the root path for compatibility.
servers:
  - url: /api/v1
    description: Canonical API prefix
  - url: /api
    description: Legacy API prefix
  - url: /
    description: Legacy root prefix
tags:
  - name: Auth
  - name: Users
  - name: Roles
  - name: Products
  - name: Categories
  - name: Brands
  - name: Customers
  - name: Stock
  - name: Orders
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: User registered }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in and return the access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Signed in }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Invalid credentials }
  /users:
    get:
      tags: [Users]
      summary: List users (ADMIN)
      responses: { '200': { description: User list } }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Users]
      summary: Get a user (ADMIN)
      responses: { '200': { description: User details } }
    put:
      tags: [Users]
      summary: Update a user (ADMIN)
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { description: User updated } }
    delete:
      tags: [Users]
      summary: Soft-delete a user (ADMIN)
      responses: { '200': { description: User deleted } }
  /roles:
    get:
      tags: [Roles]
      summary: List roles
      responses: { '200': { description: Role list } }
    post:
      tags: [Roles]
      summary: Create a role (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses: { '201': { description: Role created }, '400': { $ref: '#/components/responses/ValidationError' } }
  /roles/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Roles]
      summary: Get a role
      responses: { '200': { description: Role details } }
    put:
      tags: [Roles]
      summary: Update a role (ADMIN)
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { description: Role updated } }
    delete:
      tags: [Roles]
      summary: Delete a role (ADMIN)
      responses: { '200': { description: Role deleted } }
  /brands:
    get:
      tags: [Brands]
      summary: List brands
      responses: { '200': { description: Brand list } }
    post:
      tags: [Brands]
      summary: Create a brand (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses: { '201': { description: Brand created }, '400': { $ref: '#/components/responses/ValidationError' } }
  /brands/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Brands]
      summary: Get a brand
      responses: { '200': { description: Brand details } }
    put:
      tags: [Brands]
      summary: Update a brand (ADMIN)
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { description: Brand updated } }
    delete:
      tags: [Brands]
      summary: Delete a brand (ADMIN)
      responses: { '200': { description: Brand deleted } }
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      responses: { '200': { description: Category list } }
    post:
      tags: [Categories]
      summary: Create a category (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses: { '201': { description: Category created }, '400': { $ref: '#/components/responses/ValidationError' } }
  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Categories]
      summary: Get a category
      responses: { '200': { description: Category details } }
    put:
      tags: [Categories]
      summary: Update a category (ADMIN)
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { description: Category updated } }
    delete:
      tags: [Categories]
      summary: Delete a category (ADMIN)
      responses: { '200': { description: Category deleted } }
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      responses: { '200': { description: Customer list } }
    post:
      tags: [Customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses: { '201': { description: Customer created }, '400': { $ref: '#/components/responses/ValidationError' } }
  /customers/phone/{phone}:
    parameters:
      - name: phone
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Customers]
      summary: Find a customer by phone
      responses: { '200': { description: Customer details } }
  /customers/points/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [Customers]
      summary: Add customer points (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties: { points: { type: integer } }
      responses: { '200': { description: Points updated }, '400': { $ref: '#/components/responses/ValidationError' } }
  /customers/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    delete:
      tags: [Customers]
      summary: Soft-delete a customer (ADMIN)
      responses: { '200': { description: Customer deleted } }
  /products:
    get:
      tags: [Products]
      summary: List products with category, brand, images, variants and specs
      responses: { '200': { description: Product list } }
    post:
      tags: [Products]
      summary: Create a product with optional nested images and variants (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
      responses: { '201': { description: Product created }, '400': { $ref: '#/components/responses/ValidationError' } }
  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Products]
      summary: Get a product
      responses: { '200': { description: Product details } }
    put:
      tags: [Products]
      summary: Update a product (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string }, description: { type: string } }
      responses: { '200': { description: Product updated }, '400': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Products]
      summary: Soft-delete a product (ADMIN)
      responses: { '200': { description: Product deleted } }
  /stocks/add:
    post:
      tags: [Stock]
      summary: Add stock by IMEI (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, serialNumber]
              properties:
                variantId: { type: string }
                serialNumber: { type: string }
                status: { type: string }
      responses: { '201': { description: Stock item created }, '400': { $ref: '#/components/responses/ValidationError' } }
  /stocks/check/{serial}:
    parameters:
      - name: serial
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Stock]
      summary: Check an available IMEI
      responses: { '200': { description: Available stock item }, '404': { description: IMEI not found or already sold } }
  /stocks/status/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [Stock]
      summary: Update stock item status (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string } }
      responses: { '200': { description: Stock status updated }, '400': { $ref: '#/components/responses/ValidationError' } }
  /orders:
    get:
      tags: [Orders]
      summary: List sales orders
      responses: { '200': { description: Order list } }
    post:
      tags: [Orders]
      summary: Checkout and create a sale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses: { '201': { description: Order created }, '400': { $ref: '#/components/responses/ValidationError' } }
  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Orders]
      summary: Get an order with items
      responses: { '200': { description: Order details } }
  /orders/cancel/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Orders]
      summary: Cancel an order
      responses: { '200': { description: Order cancelled } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  responses:
    ValidationError:
      description: Request validation failed; the usual error envelope is returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [success, status, message]
      properties:
        success: { type: boolean, enum: [false] }
        status: { type: integer }
        message: { type: string }
    SuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: {}
    RegisterRequest:
      type: object
      required: [password, name]
      properties:
        email: { type: string, format: email, description: email or legacy username is required }
        username: { type: string, description: Legacy alias accepted for email }
        password: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        roleId: { oneOf: [{ type: string }, { type: integer }] }
        tenantId: { type: string }
    LoginRequest:
      type: object
      required: [password]
      properties:
        email: { type: string, description: email or legacy username is required }
        username: { type: string, description: Legacy alias accepted for email }
        password: { type: string, minLength: 1 }
    NameRequest:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1 } }
    CustomerRequest:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        points: { type: integer, minimum: 0 }
    ProductCreateRequest:
      type: object
      required: [name, categoryId, brandId]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        categoryId: { oneOf: [{ type: string }, { type: integer }] }
        brandId: { oneOf: [{ type: string }, { type: integer }] }
        images:
          type: object
          properties:
            create:
              type: array
              items:
                type: object
                required: [imageUrl]
                properties: { imageUrl: { type: string, format: uri }, isMain: { type: boolean } }
        variants:
          type: object
          properties:
            create:
              type: array
              items:
                type: object
                required: [color, price, stockQuantity]
                properties:
                  color: { type: string }
                  sku: { type: string }
                  price: { type: number, minimum: 0 }
                  stockQuantity: { type: integer, minimum: 0 }
    OrderCreateRequest:
      type: object
      required: [totalAmount, items]
      properties:
        employeeId: { type: string }
        customerId: { oneOf: [{ type: string }, { type: integer }, { type: 'null' }] }
        totalAmount: { type: number, minimum: 0 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [variantId, quantity, priceAtTime]
            properties:
              variantId: { oneOf: [{ type: string }, { type: integer }] }
              quantity: { type: integer, minimum: 1 }
              priceAtTime: { type: number, minimum: 0 }
              stockItemIds: { type: array, items: { oneOf: [{ type: string }, { type: integer }] } }
