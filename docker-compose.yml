# Local dev not needed — Supabase hosted Postgres is used (see .env DATABASE_URL)
# This file kept for legacy local MySQL reference. For Supabase local, use Supabase CLI or point DATABASE_URL to pooler.
# To run a local Postgres mimicking Supabase (optional):
#  postgres:
#    image: postgres:15
#    container_name: supabase-local-db
#    environment:
#      POSTGRES_DB: postgres
#      POSTGRES_USER: postgres
#      POSTGRES_PASSWORD: postgres
#    ports:
#      - "5432:5432"

services:
  placeholder:
    image: alpine:latest
    container_name: supabase-placeholder
    command: ["sh", "-c", "echo 'Supabase hosted DB in use — see backend/.env' && sleep infinity"]

volumes:
  mysql_data: